<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous" />
  <link rel="stylesheet" href="{{BASE_PATH}}assets/css/main.css" />
  {{HEAD_EXTRA}}
</head>
<body data-page="{{PAGE_ID}}">
  <nav class="topnav">
    <a href="{{BASE_PATH}}index.html" class="nav-brand"><span class="brand-icon">{{BRAND_ICON}}</span> {{COURSE_SHORT_NAME}} <span style="opacity:.5">TH</span></a>
    <input type="checkbox" id="nav-toggle" />
    <label for="nav-toggle" class="nav-hamburger" aria-label="เมนู"><span></span><span></span><span></span></label>
    <label for="nav-toggle" class="nav-overlay" aria-hidden="true"></label>
    <div class="nav-links">
      <div class="nav-group nav-group-top">
        {{NAV_LINKS}}
      </div>
    </div>
    <a href="{{BASE_PATH}}index.html#progress" class="nav-xp">⭐ <span id="nav-xp-total">0</span> XP</a>
  </nav>

  <main>
    {{BODY}}
  </main>

  <script>
    window.__COURSE_CONFIG__ = {{COURSE_CONFIG_JSON}};
    window.__PAGE_DATA__ = {{PAGE_DATA_JSON}};
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"></script>
  {{SCRIPTS}}
</body>
</html>
